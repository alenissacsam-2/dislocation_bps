# cryptobot settings.
#
# In a checkout this file is config.example.toml: copy it to config.toml, which is
# gitignored, and edit that. An installed copy is seeded from this same text into
# %LOCALAPPDATA%\cryptobot\config.toml and edits it in place, so the words below have
# to read correctly in both situations.
#
# "paper" = detect and record only, never sign or send. This is the default and
# should stay that way until the measured edge justifies otherwise.
# "live"  = real transactions. ALSO requires CRYPTOBOT_ALLOW_LIVE=1 in the environment.
mode = "paper"

# Public mainnet WebSocket. Rate-limited and lags by hundreds of ms; see
# docs/research/03-dex-landscape.md for what that does to measurement accuracy.
rpc_ws_url = "wss://api.mainnet-beta.solana.com"

# Minimum gross profit to record an opportunity as actionable. 1_000_000 lamports
# = 0.001 SOL, about $0.077 at $76.97/SOL.
min_profit_lamports = 1000000

# Hard ceiling per trade. 20_000_000 lamports = 0.02 SOL, about $1.54.
max_position_lamports = 20000000

# Where pool state comes from. "live" reads real mainnet accounts (read-only, safe);
# "simulated" runs a synthetic market for offline work.
feed = "live"
rpc_http_url = "https://api.mainnet-beta.solana.com"

# Total working capital in USD, and how much of it is reserved for fees and rent.
#
# At $5 this was the binding constraint on nearly everything: the run sized ~$4.44 into
# opportunities whose optimum averaged ~$145, collecting about 3% of what it found. The
# ledger now prices every opportunity at $100 / $1k / $10k as it happens, so the next
# change to this number can be made against a measurement instead of a guess.
capital_usd = 100.0
fee_buffer_usd = 0.20

# Smallest trade worth carrying, and so the depth a cycle needs before its rate counts
# as tradeable rather than as a quote.
#
# Not the same as capital: a book does not have to deploy all of itself in one loop.
# What sets this floor is fixed cost — a transaction costs the same carrying $5 or
# $5,000, so below some size the fee eats the edge. Roughly `tx cost / edge`: a few
# dollars on Solana, hundreds on an L2 paying cents in gas, six figures on Ethereum L1.
# It is the first number to change when pointing this instrument at another chain.
min_trade_usd = 10.0

# Longest cycle to search. 3 finds triangles (SOL -> USDC -> RAY -> SOL), which is
# where real cycles live among the majors; 2 only finds duplicate-pair arbs.
max_hops = 3

# ── Risk limits ───────────────────────────────────────────────────────────────
#
# Hard stops for live execution, not targets. Nothing is signed that breaches one.
# They are read by the gate in crates/executor, which assumes the rest of the system
# is wrong and bounds what being wrong costs.
#
# These are edited from the Parameters tab. Saving them does not archive the run:
# limits bound what may be signed, they do not change how anything is measured.

# The most any single trade may carry.
max_position_usd = 25.0

# Realised losses reaching this halt trading for the day. A halt survives midnight —
# a breaker still tripped in the morning was tripped by something the night did not fix.
max_daily_loss_usd = 5.0

# Expected net below which a trade is not worth its own risk. Deliberately not zero:
# a trade expected to net a hundredth of a cent is indistinguishable from noise in the
# estimate that produced it, and that estimate is what is trusted when it signs.
min_net_profit_usd = 0.01

# How far the simulated result may fall short of the quote before it is refused.
max_slippage_bps = 30.0

# Consecutive reverts or rejections before the breaker trips. A lost race does not
# count: losing races is what racing is, and counting it would stop trading on a busy
# day rather than a broken one.
max_consecutive_failures = 3

# Upper bound on trades per day, whatever they are worth.
max_daily_trades = 500

# ---------------------------------------------------------------------------
# Live execution. None of this does anything while mode = "paper".
# ---------------------------------------------------------------------------

# How far below each hop's quote its output floor is set, in basis points.
#
# THIS MUST BE SMALLER THAN THE EDGE DIVIDED BY THE HOP COUNT.
#
# A route only builds if its last floor exceeds its first input, so for n hops at edge
# e the requirement is (1 + e)(1 - s)^n > 1, which for small numbers is s < e / n.
# A 3 bp edge over two hops leaves room for 1.5 bp per hop and no more.
#
# This was 30, on the reasoning that a wide floor is cautious. That is backwards: a
# floor this wide makes the route's own loss-check unsatisfiable, and a live dry run
# refused every cycle it found at -25 to -28 bps guaranteed. You cannot tolerate more
# slippage than the profit you are chasing.
#
# The cost of a tight floor is that an adverse tick reverts the transaction instead of
# filling it badly. That is the fee, and it is the right price for the alternative.
#
# Not the same number as max_slippage_bps above: that one judges the simulated result
# after the fact, this one is written into the instruction the pool must honour.
slippage_bps = 1

# Priority bid in micro-lamports per compute unit. 0 pays the base fee only.
priority_micro_lamports = 0

# Build, sign and simulate every trade — and submit none.
#
# The last switch before real money moves, and deliberately separate from `mode`.
# Arming live execution and spending are two decisions. A config that does not mention
# this key is a dry run; cb-core has a test that fails if that ever stops being true.
#
# Leave it here until you have watched a live-armed run simulate for a while and read
# what it says it would have done.
dry_run = true
